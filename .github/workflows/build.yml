# ============================================================
# BlindNotepad CI/CD 工作流
# 触发条件：推送代码 / 创建标签 / 手动触发
# 运行环境：Windows Server 2022（原生 WPF 支持）
# 产物：自包含 win-x64 可执行文件，自动发布到 GitHub Releases
# ============================================================

name: 构建与发布

on:
  # 推送到 main/master 分支时自动构建
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  # Pull Request 时构建验证（不发布）
  pull_request:
    branches: [ main, master ]
  # 手动触发
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: Release
  RUNTIME: win-x64

jobs:
  build:
    name: 构建打包
    runs-on: windows-2022

    steps:
      # ===== 1. 拉取代码 =====
      - name: 检出代码
        uses: actions/checkout@v4

      # ===== 2. 安装 .NET SDK =====
      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ===== 3. 缓存 NuGet 包（项目内 .nuget/ 目录） =====
      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: |
            .nuget/packages
            .nuget/v3-cache
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ===== 4. 还原依赖 =====
      - name: 还原 NuGet 包
        run: dotnet restore --configfile NuGet.config

      # ===== 5. 编译 =====
      - name: 编译项目
        run: dotnet build --no-restore -c ${{ env.CONFIGURATION }}

      # ===== 6. 发布（自包含，单文件） =====
      - name: 发布自包含包
        run: |
          dotnet publish -c ${{ env.CONFIGURATION }} -r ${{ env.RUNTIME }} --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o ./artifacts/release

      # ===== 7. 复制额外文件（如有） =====
      - name: 复制许可证等文件
        shell: pwsh
        run: |
          if (Test-Path LICENSE) { Copy-Item LICENSE ./artifacts/release/ }
          if (Test-Path README.md) { Copy-Item README.md ./artifacts/release/ }

      # ===== 8. 打包 ZIP =====
      - name: 创建 ZIP 包
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -notmatch '^v') { $version = "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $zipName = "BlindNotepad_${version}_win-x64.zip"
          Compress-Archive -Path ./artifacts/release/* -DestinationPath "./artifacts/$zipName"
          Write-Host "ZIP 包: $zipName"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      # ===== 9. 上传构建产物（所有分支） =====
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: BlindNotepad-build
          path: ./artifacts/*.zip
          retention-days: 30

      # ===== 10. 发布到 GitHub Releases（仅标签推送） =====
      - name: 发布到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
